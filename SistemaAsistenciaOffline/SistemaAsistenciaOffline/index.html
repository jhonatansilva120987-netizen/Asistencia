```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Asistencia Offline</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Sistema de Control de Asistencia</h1>
        <p>Registro de asistencia offline</p>
        <div id="estadoConexion" role="status">
            🔴 Sin conexión
        </div>
    </header>

    <main>

        <!-- FORMULARIO DE REGISTRO -->
        <section class="formulario">

            <h2>Registrar asistencia</h2>

            <label for="dni">DNI:</label>
            <input
                type="text"
                id="dni"
                placeholder="Ingrese los 8 dígitos del DNI"
                inputmode="numeric"
                maxlength="8"
                minlength="8"
                pattern="[0-9]{8}"
                autocomplete="off"
                required
            >

            <label for="nombres">Nombres:</label>
            <input
                type="text"
                id="nombres"
                placeholder="Ingrese nombres"
                required
            >

            <label for="apellidos">Apellidos:</label>
            <input
                type="text"
                id="apellidos"
                placeholder="Ingrese apellidos"
                required
            >

            <!-- NIVEL, GRADO Y SECCIÓN EN UNA SOLA FILA -->
            <div class="fila-academica">

                <div class="campo">
                    <label for="nivel">Nivel educativo:</label>
                    <select id="nivel" required>
                        <option value="">Seleccione nivel</option>
                        <option value="Inicial">Inicial</option>
                        <option value="Primaria">Primaria</option>
                        <option value="Secundaria">Secundaria</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="grado">Grado:</label>
                    <select id="grado" required disabled>
                        <option value="">Seleccione nivel primero</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="seccion">Sección:</label>
                    <select id="seccion" required disabled>
                        <option value="">Seleccione grado primero</option>
                    </select>
                </div>

            </div>

            <button
                type="button"
                onclick="registrarAsistencia()"
            >
                Registrar asistencia
            </button>

        </section>


        <!-- HISTORIAL DE ASISTENCIA -->
        <section class="historial">

            <h2>Historial de asistencia</h2>

            <button
                type="button"
                onclick="sincronizar()"
            >
                🔄 Sincronizar
            </button>

            <button
                type="button"
                onclick="limpiarRegistros()"
            >
                🗑️ Limpiar registros
            </button>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>DNI</th>
                            <th>Estudiante</th>
                            <th>Nivel</th>
                            <th>Grado</th>
                            <th>Sección</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="tablaAsistencia">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
```
